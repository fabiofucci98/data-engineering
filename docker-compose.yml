# Shared (cross-stack) components only. Each data pipeline owns its compose file
# with its OWN Postgres database:
#   - scientific-data/docker-compose.yml   (USGS earthquakes app + its own Postgres)
#   - city-simulation/docker-compose.yml   (city generator + its own Postgres)
# This file runs the shared dev tooling (pgAdmin) and creates the shared Docker
# network `sdp-shared` that both stack databases join, so pgAdmin can reach them by
# service name (sci-db:5432, city-db:5432).
#
# Order: bring this up first, then the stacks.
name: data-engineering

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      # The image's entrypoint auto-loads this on first init:
      #   setup.py load-servers <file> --user <email>
      # so both stack databases appear automatically after login.
      # (Set PGADMIN_REPLACE_SERVERS_ON_STARTUP=True to re-sync on every restart.)
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - shared

networks:
  shared:
    name: sdp-shared

volumes:
  pgadmin_data: